<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256">
  <!-- horizontal logo: app icon + wordmark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <mask id="cut">
      <rect width="256" height="256" fill="#fff"/>
      <g transform="rotate(-45 128 128)"><rect x="0" y="88" width="256" height="80" fill="#000"/></g>
    </mask>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="#fff" stroke-width="26" mask="url(#cut)"/>
  <g transform="translate(128 128) rotate(-45) scale(1.3)">
    <path fill="#fff" d="M62 0L-50 -33L-28 0L-50 33Z"/>
    <path fill="#5B3FD9" fill-opacity=".35" d="M62 0L-28 0L-50 33Z"/>
  </g>
  <text x="290" y="170" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-3" fill="#5B3FD9">null<tspan fill="#2AABEE" font-weight="400">gram</tspan></text>
</svg>
